services:
  # ==========================================================
  # 1. Laravel Application Service (PHP 8.4 FPM)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langit_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-langit_db}
      DB_USERNAME: ${DB_USERNAME:-langit_user}
      DB_PASSWORD: ${DB_PASSWORD:-langit_secret_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SEED_ON_DEPLOY: ${SEED_ON_DEPLOY:-false}
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
    networks:
      - langit_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================================
  # 2. High-Performance Web Server (Nginx)
  # ==========================================================
  web:
    image: nginx:1.27-alpine
    container_name: langit_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - app_uploads:/var/www/html/public/uploads:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    networks:
      - langit_network
    depends_on:
      - app

  # ==========================================================
  # 3. Database Service (MariaDB 10.11 LTS - Low RAM & High Speed)
  # ==========================================================
  db:
    image: mariadb:10.11
    container_name: langit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-langit_db}
      MYSQL_USER: ${DB_USERNAME:-langit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-langit_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - langit_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 4. In-Memory Cache, Session & Queue Store (Redis)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: langit_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - langit_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 5. Background Queue Worker (Async Tasks, Emails, Media)
  # ==========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langit_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-langit_db}
      DB_USERNAME: ${DB_USERNAME:-langit_user}
      DB_PASSWORD: ${DB_PASSWORD:-langit_secret_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
    networks:
      - langit_network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================================
  # 6. Cron Task Scheduler (Automated Routine Jobs)
  # ==========================================================
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langit_cron
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-langit_db}
      DB_USERNAME: ${DB_USERNAME:-langit_user}
      DB_PASSWORD: ${DB_PASSWORD:-langit_secret_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
    networks:
      - langit_network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

# ==========================================================
# Persistent Volumes (Data Preservation Across Reboots & Updates)
# ==========================================================
volumes:
  db_data:
    name: langit_db_data
  redis_data:
    name: langit_redis_data
  app_storage:
    name: langit_app_storage
  app_uploads:
    name: langit_app_uploads
  certbot_etc:
    name: langit_certbot_etc
  certbot_var:
    name: langit_certbot_var

# ==========================================================
# Isolated Internal Network
# ==========================================================
networks:
  langit_network:
    name: langit_network
    driver: bridge
